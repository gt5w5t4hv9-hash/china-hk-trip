  function aiContextBlock(){
    var ctx = getTodayContext();
    var lines = [];
    lines.push("Дата устройства: " + ctx.now.toLocaleString("ru-RU"));
    lines.push("День маршрута: " + ctx.day.dayLabel + " · " + ctx.day.dateLabel);
    lines.push("Город: " + (ctx.meta?ctx.meta.name:ctx.city));
    if(ctx.day.theme) lines.push("Тема: " + ctx.day.theme);
    lines.push("Сейчас (по времени): " + (ctx.nowRow ? ctx.nowRow.time + " · " + ctx.nowRow.place : "—"));
    lines.push("Дальше: " + (ctx.nextRow ? ctx.nextRow.time + " · " + ctx.nextRow.place : "конец дня"));
    lines.push("Пункты дня:");
    ctx.rows.forEach(function(r,i){
      var opt = isOptionalRow(r) ? " [optional]" : "";
      lines.push((i+1)+". "+(r.time||"")+" "+(r.place||"")+opt+(r.transit && r.transit!=="—" ? " | "+r.transit : ""));
    });
    return lines.join("\n");
  }

  function answerAI(kind, freeText){
    var ctx = getTodayContext();
    var day = ctx.day;
    var rows = ctx.rows;
    var out = [];
    out.push("МОЙ МАРШРУТ");

    function listRows(arr, limit){
      return arr.slice(0, limit||8).map(function(r){
        return "• " + (r.time?r.time+" · ":"") + r.place + (isOptionalRow(r)?" (можно пропустить)":"");
      }).join("\n");
    }

    var q = (freeText||"").toLowerCase();
    if(kind==="now" || /сейчас|что делать сейчас/.test(q)){
      out.push("Сейчас: " + (ctx.nowRow ? (ctx.nowRow.time+" · "+ctx.nowRow.place) : "начало дня"));
      if(ctx.nowRow && ctx.nowRow.transit && ctx.nowRow.transit!=="—") out.push("Транспорт/заметка: " + ctx.nowRow.transit);
      if(ctx.nowRow && ctx.nowRow.notes) out.push("Заметка: " + ctx.nowRow.notes);
      out.push("Дальше: " + (ctx.nextRow ? (ctx.nextRow.time+" · "+ctx.nextRow.place) : "на сегодня пунктов больше нет"));
      if(ctx.nextRow && ctx.nextRow.transit && ctx.nextRow.transit!=="—") out.push("Как: " + ctx.nextRow.transit);
      return out.join("\n");
    }
    if(kind==="next" || /дальше|следующ/.test(q)){
      if(!ctx.nextRow){ out.push("После текущей точки обязательных пунктов в плане на сегодня больше нет."); return out.join("\n"); }
      out.push("Следующее: " + ctx.nextRow.time + " · " + ctx.nextRow.place);
      if(ctx.nextRow.transit && ctx.nextRow.transit!=="—") out.push("Путь: " + ctx.nextRow.transit);
      if(ctx.laterRows[0]) out.push("Потом: " + (ctx.laterRows[0].time||"") + " · " + ctx.laterRows[0].place);
      return out.join("\n");
    }
    if(kind==="today" || /сегодня|что у нас сегодня/.test(q)){
      out.push(day.dayLabel + " · " + (ctx.meta?ctx.meta.name:"") + " · " + day.dateLabel);
      if(day.theme) out.push(day.theme);
      out.push(listRows(rows, 12));
      if(day.footer && day.footer[0]) out.push(day.footer[0]);
      return out.join("\n");
    }
    if(kind==="tomorrow" || /завтра/.test(q)){
      var n = TRIP.days[ctx.todayIdx+1];
      if(!n){ out.push("Это последний день в сохранённом маршруте."); return out.join("\n"); }
      out.push("Завтра: " + n.dayLabel + " · " + n.dateLabel + " · " + (CITY_META[n.city]?CITY_META[n.city].name:""));
      if(n.theme) out.push(n.theme);
      out.push(listRows(n.rows||[], 10));
      return out.join("\n");
    }
    if(kind==="food" || /поесть|еда|ресторан|обед|ужин/.test(q)){
      var foods = [];
      rows.forEach(function(r){
        (r.food||[]).forEach(function(f){ if(f.text && f.text!=="—") foods.push("• " + f.text); });
        if(/ужин|обед|завтрак|noodles|dumpling|duck|tang bao|dim sum|кафе|ресторан/i.test(r.place||""))
          foods.push("• " + r.place + (r.time?" ("+r.time+")":""));
      });
      var near = ctx.nowRow ? findNearby(ctx.nowRow.place) : null;
      if(near) near.filter(function(x){ return x.type==="food"||x.type==="cafe"; }).forEach(function(x){
        foods.push("• рядом: " + x.name + (x.meta?" · "+x.meta:""));
      });
      if(!foods.length) out.push("В плане на сегодня отдельные рестораны не расписаны текстом — смотри пункты с едой в дне.");
      else out.push(foods.slice(0,12).join("\n"));
      return out.join("\n");
    }
    if(kind==="near" || /рядом/.test(q)){
      var place = ctx.nowRow ? ctx.nowRow.place : (rows[0]&&rows[0].place);
      var near = findNearby(place);
      out.push("Точка отсчёта: " + (place||"—"));
      if(!near){ out.push("В сохранённых «рядом» для этой точки списка нет. Открой день → «Ещё»."); return out.join("\n"); }
      near.slice(0,10).forEach(function(x){
        out.push("• " + (TYPE_LABEL[x.type]||"") + " " + x.name + (x.meta?" · "+x.meta:""));
      });
      return out.join("\n");
    }
    if(kind==="skip" || kind==="cut" || kind==="tired" || /пропуст|сократ|устал|легче|опоздал|убрать/.test(q)){
      var opts = rows.filter(isOptionalRow);
      var soft = rows.filter(function(r){
        return /shop|шоп|market|улиц|optional|фото|insta|бар/i.test((r.place||"")+(r.notes||"")) && !/Forbidden|Mutianyu|Peak|Tower|Wall|West Lake|天坛|Gugong/i.test(r.place||"");
      });
      out.push("Я не меняю ваш план сам. Предложения:");
      if(opts.length){
        out.push("Похоже на необязательное в тексте плана:");
        opts.forEach(function(r){ out.push("• " + r.place); });
      }
      if(soft.length){
        out.push("Что обычно можно сжать, если мало времени/сил:");
        soft.slice(0,6).forEach(function(r){ out.push("• " + r.place); });
      }
      if(!opts.length && !soft.length) out.push("Явных optional в формулировках дня не видно — смотрите «Ещё» у пунктов и footer дня.");
      out.push("Обязательные must (лучше не трогать): стена, Gugong, Peak, Bund/Tower, West Lake — если они в дне.");
      return out.join("\n");
    }
    if(kind==="add" || /добав|раньше|успеем|2 часа|два часа/.test(q)){
      var near = ctx.nowRow ? findNearby(ctx.nowRow.place) : null;
      out.push("Добавлять в основной план я не буду без вашего решения. Из уже сохранённого «рядом»/optional:");
      if(near) near.slice(0,6).forEach(function(x){ out.push("• " + x.name + (x.desc?" — "+x.desc.slice(0,60):"")); });
      else out.push("Откройте текущую точку → «Ещё» → 📍 Рядом.");
      return out.join("\n");
    }
    if(kind==="rain" || /дожд|rain/.test(q)){
      out.push("Актуальную погоду я не проверяю (нужен интернет/консьерж).");
      out.push("Из вашего плана при дожде логичнее приоритет indoor из сегодняшнего списка:");
      rows.forEach(function(r){
        if(/museum|mall|шоп|кафе|tower|музей|храм|temple|gallery|798|IFC|PMQ|Tai Kwun/i.test(r.place||""))
          out.push("• " + r.place);
      });
      out.push("Уличные прогулки (улицы, озеро, стена, трейл) — по самочувствию и погоде.");
      return out.join("\n");
    }
    if(kind==="how" || /добраться|как дойти|метро|транспорт/.test(q)){
      if(ctx.nextRow){
        out.push("До следующего пункта:");
        out.push(ctx.nextRow.place);
        out.push(ctx.nextRow.transit && ctx.nextRow.transit!=="—" ? ctx.nextRow.transit : "В плане отдельный транспорт не указан — откройте 🗺 Карты у пункта.");
        var tips = findPlaceTips(ctx.nextRow.place);
        if(tips && tips.metro) out.push("Метро/вход: " + tips.metro);
      } else out.push("Следующего пункта нет — смотрите день целиком.");
      return out.join("\n");
    }
    // generic free text
    if(/завтра/.test(q)) return answerAI("tomorrow");
    if(/сегодня/.test(q)) return answerAI("today");
    if(/дальше|следующ/.test(q)) return answerAI("next");
    if(/сейчас/.test(q)) return answerAI("now");
    if(/рядом/.test(q)) return answerAI("near");
    if(/еда|поесть/.test(q)) return answerAI("food");
    out.push("Я отвечаю по сохранённому itinerary (не из интернета).");
    out.push("Спросите: что сейчас / дальше / сегодня / завтра / рядом / где поесть / что пропустить.");
    out.push("Контекст:\n" + (ctx.nowRow?ctx.nowRow.place:"—") + " → " + (ctx.nextRow?ctx.nextRow.place:"конец"));
    return out.join("\n");
  }

  function aiLog(role, text, meta){
    var log = document.getElementById("aiLog"); if(!log) return null;
    var m = el("div","ai-msg "+role);
    if(role==="bot"){
      var tag = meta && meta.web ? "✦ AI · ИНТЕРНЕТ (бесплатно, Gemini)" : "✦ AI · МОЙ МАРШРУТ (офлайн)";
      m.innerHTML = "<div class='tag'>" + esc(tag) + "</div>" + esc(text||"").replace(/\n/g,"<br>");
      if(meta && meta.location){
        m.innerHTML += "<div class='ai-location'>📍 " + esc(meta.location) + "</div>";
      }
      if(meta && meta.sources && meta.sources.length){
        var box = document.createElement("div"); box.className="ai-sources";
        var title=document.createElement("div"); title.textContent="Источники"; title.style.fontWeight="700"; box.appendChild(title);
        meta.sources.slice(0,5).forEach(function(src){
          var a=document.createElement("a");
          a.href=src.url; a.target="_blank"; a.rel="noopener";
          a.textContent="↗ "+(src.title||src.url);
          box.appendChild(a);
        });
        m.appendChild(box);
      }
    } else if(role==="typing"){
      m.innerHTML = "<div class='ai-msg bot ai-typing'>✦ Ищу актуальную информацию…</div>";
    } else {
      m.textContent = text;
    }
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return m;
  }

  function aiTripContext(){
    var ctx=getTodayContext();
    var lines=[];
    lines.push("ТЕКУЩИЙ КОНТЕКСТ");
    lines.push("Дата/время устройства: "+ctx.now.toLocaleString("ru-RU"));
    lines.push("Текущий день: "+ctx.day.dayLabel+" · "+ctx.day.dateLabel);
    lines.push("Город: "+(ctx.meta?ctx.meta.name:ctx.city));
    if(ctx.day.theme) lines.push("Тема дня: "+ctx.day.theme);
    lines.push("Текущая точка по расписанию: "+(ctx.nowRow?ctx.nowRow.time+" · "+ctx.nowRow.place:"не определена"));
    lines.push("Следующая точка: "+(ctx.nextRow?ctx.nextRow.time+" · "+ctx.nextRow.place:"нет"));
    lines.push("Пункты текущего дня:");
    (ctx.rows||[]).forEach(function(r,i){
      lines.push((i+1)+". "+(r.time||"")+" · "+(r.place||"")+" | путь: "+(r.transit||"—")+" | заметки: "+(r.notes||"—"));
      (r.food||[]).forEach(function(f){ if(f.text&&f.text!=="—") lines.push("   ЕДА: "+f.text); });
    });
    var n=TRIP.days[ctx.todayIdx+1];
    if(n){
      lines.push("ЗАВТРА: "+n.dayLabel+" · "+n.dateLabel+" · "+(CITY_META[n.city]?CITY_META[n.city].name:""));
      (n.rows||[]).slice(0,12).forEach(function(r){ lines.push("- "+(r.time||"")+" · "+r.place); });
    }
    return lines.join("\n");
  }

  function aiSetStatus(online){
    var dot=document.getElementById("aiStatusDot"), txt=document.getElementById("aiStatusText");
    if(dot) dot.className="ai-status-dot "+(online?"online":"offline");
    if(txt) txt.textContent=online?"AI + интернет · бесплатно (Gemini)":"Офлайн-режим · только сохранённый маршрут";

  // Лёгкий пинг: спрашивает у /api/ai только "настроен ли ключ", БЕЗ вызова модели — бесплатно и не тратит дневную квоту.
  function pingBackend(){
    if(!navigator.onLine){ aiSetStatus(false); return; }
    fetch("/api/ai", {method:"GET"}).then(function(r){ return r.ok?r.json():null; }).then(function(data){
      aiSetStatus(!!(data && data.hasKey));
    }).catch(function(){ aiSetStatus(false); });
  }

  function getBrowserLocation(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(function(pos){
        resolve({lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:Math.round(pos.coords.accuracy||0)});
      }, function(){ resolve(null); }, {enableHighAccuracy:true,timeout:7000,maximumAge:120000});
    });
  }

  function askAI(kind, text){
    var isChip = !text && kind && kind !== "free";
    var query=text || ({
      now:"Что делать сейчас?", next:"Что дальше?", today:"Что у нас сегодня?",
      near:"Что рядом?", food:"Где поесть?", cut:"Сократи день",
      tired:"Сделай день легче", rain:"Если дождь", skip:"Что пропустить?",
      add:"Что добавить?", tomorrow:"Что у нас завтра?", how:"Как добраться?"
    }[kind]||kind);

    aiLog("user", query);

    var needsLocation=/\b(рядом|поблизости|около меня|возле меня|near me|здесь|я сейчас)\b/i.test(query);
    var locationPromise=needsLocation?getBrowserLocation():Promise.resolve(null);

    // Быстрые готовые вопросы по маршруту — мгновенный локальный ответ, без сети и без квоты.
    if(isChip){
      locationPromise.then(function(location){
        aiLog("bot", answerAI(kind, query), {
          location: location ? location.lat.toFixed(4)+", "+location.lng.toFixed(4) : null
        });
      });
      return;
    }

    // Свой вопрос — реальный ИИ с поиском в интернете (бесплатный ключ Gemini на бэкенде).
    var typing = aiLog("typing", "");
    locationPromise.then(function(location){
      var payload = {
        query: query,
        context: aiTripContext(),
        location: location,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      };
      return fetch("/api/ai", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      }).then(function(r){
        if(!r.ok) throw new Error("API "+r.status);
        return r.json();
      }).then(function(data){
        if(typing && typing.parentNode) typing.parentNode.removeChild(typing);
        aiSetStatus(true);
        aiLog("bot", data.answer || "Не получилось сформулировать ответ.", {
          web: !!data.web,
          sources: data.sources || []
        });
      }).catch(function(){
        if(typing && typing.parentNode) typing.parentNode.removeChild(typing);
        aiSetStatus(false);
        aiLog("bot", answerAI(kind, query) + "\n\n(Не удалось связаться с интернет-ИИ — офлайн-ответ по маршруту.)", {web:false});
      });
    });
  }

    keys.forEach(function(k){
      var b=document.createElement("button");
